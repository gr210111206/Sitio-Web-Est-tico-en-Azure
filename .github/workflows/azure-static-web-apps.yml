name: CI/CD - Deploy to Azure Static Web Apps

# Se dispara en cada push a la rama principal (main)
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build y Deploy
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build y despliegue a Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Token generado automáticamente por Azure al crear el recurso.
          # Guárdalo como secret en GitHub: Settings > Secrets > Actions
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Rutas de la aplicación ######
          app_location: "/"        # Carpeta raíz del código fuente
          api_location: ""          # Sin API (sitio puramente estático)
          output_location: ""       # Sin paso de build: HTML/CSS/JS ya listos
          ####################################

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cerrar entorno de PR
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
